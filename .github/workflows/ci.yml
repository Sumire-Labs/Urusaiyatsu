name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Install from the reproducible lock file so CI matches Docker.
        run: python -m pip install -r requirements.lock

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile check
        # Dockerless equivalent of the AGENTS.md Docker compile check
        # (python -m compileall -q /app). Bytecode is redirected to a temp
        # dir so the repository is not polluted.
        run: PYTHONPYCACHEPREFIX=/tmp/pycache python -m compileall -q core cogs views modals main.py
